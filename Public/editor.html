<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Editor</title>
    <link rel="stylesheet" href="editorstyle.css">
    <script src="/socket.io/socket.io.js"></script>
</head>

<!-- Модалка сохранения -->
<div class="save-modal-overlay" id="saveModalOverlay" style="display:none;">
  <div class="save-modal">
    <h3>Сохранить схему</h3>
    <div class="save-modal-text">Дайте название вашей блок-схеме</div>
    <input type="text" id="flowchartTitleInput" placeholder="Название схемы">
    <div class="save-modal-buttons">
      <button id="saveConfirmBtn">Сохранить</button>
      <button id="saveSkipBtn" style="margin-bottom:0;">Не сохранять</button>
    </div>
  </div>
</div>

<!-- Хотбар участников -->
<div class="hotbar" id="hotbar" style="display:none;">
    <div class="hotbar-inner">
        <div class="hotbar-session-id">
            <span class="hotbar-label">Сессия:</span>
            <span id="hotbarSessionId" class="hotbar-code"></span>
            <button class="hotbar-copy-btn" id="hotbarCopyBtn">Скопировать</button>
        </div>
        <div class="hotbar-users" id="hotbarUsers"></div>
    </div>
</div>

<body>

    <div class="app-container">
        <!-- Боковая панель -->
        <aside class="sidebar">
            <h3 class="sidebar-title">Элементы</h3>
            <div class="element-list">
                <!-- Терминатор (Пуск/Останов) -->
                <div class="draggable-item" draggable="true" data-type="terminal">
                    <div class="shape-wrapper">
                        <div class="shape terminal"></div>
                    </div>
                    <span class="label">Терминатор</span>
                </div>

                <!-- Процесс -->
                <div class="draggable-item" draggable="true" data-type="process">
                    <div class="shape-wrapper">
                        <div class="shape process"></div>
                    </div>
                    <span class="label">Процесс</span>
                </div>

                <!-- Решение (Условие) -->
                <div class="draggable-item" draggable="true" data-type="decision">
                    <div class="shape-wrapper">
                        <div class="shape decision"></div>
                    </div>
                    <span class="label">Решение</span>
                </div>

                <!-- Данные (Ввод/Вывод) -->
                <div class="draggable-item" draggable="true" data-type="data">
                    <div class="shape-wrapper">
                        <div class="shape data"></div>
                    </div>
                    <span class="label">Данные</span>
                </div>

                <!-- Предопределенный процесс -->
                <div class="draggable-item" draggable="true" data-type="predefined">
                    <div class="shape-wrapper">
                        <div class="shape predefined"></div>
                    </div>
                    <span class="label">Предопределенный процесс</span>
                </div>

                <!-- Соединитель -->
                <div class="draggable-item" draggable="true" data-type="connector">
                    <div class="shape-wrapper">
                        <div class="shape connector"></div>
                    </div>
                    <span class="label">Соединитель</span>
                </div>
            </div>

            <div class="sidebar-session">
                <button class="btn-session" id="startSessionBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                    </svg>
                    <span>Совместное редактирование</span>
                </button>
            </div>

            <div class="sidebar-footer">
                <a href=MainMenu.html style="text-decoration: none;">
                    <button class="btn-exit">
                        <svg class="exit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        <span>Выйти в меню</span>
                    </button>
                </a>
            </div>
    
        </aside>

        <!-- Рабочая область -->
        <main class="canvas-area">
            <svg id="canvas-svg" width="3000" height="3000">
                <!-- Сетка (определяем паттерн) -->
                <defs>
                    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
                        <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8f0" stroke-width="1"/>
                    </pattern>
                </defs>
                
                <!-- Заполняем фон сеткой -->
                <rect width="100%" height="100%" fill="url(#grid)" />

                <!-- Сюда JS будет добавлять блоки и линии -->
                <g id="main-layer"> 
                     <rect width="100%" height="100%" fill="transparent" pointer-events="all" />
                </g>
            </svg>
        </main>
    </div>

    <script src="WorkWithredact.js"></script>
</body>

</html>
